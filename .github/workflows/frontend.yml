name: Deployment to frontend
on:
  push:
    branches:
      - master
  workflow_dispatch:
concurrency:
  group: Build and Deploy
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CDN_DISTRIBUTION_ID: ${{ vars.CDN_DISTRIBUTION_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      NODE_VERSION: ${{ vars.NODE_VERSION }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws s3 rm s3://${{ env.S3_BUCKET }}/ --recursive
          aws s3 cp frontend/dist s3://${{ env.S3_BUCKET }} --cache-control 'public, max-age=31104000' --recursive
          # Delete all .map files inside assets folder (Vite default)
          aws s3 rm s3://${{ env.S3_BUCKET }}/assets/ --recursive --exclude "*" --include "*.map"
          aws configure set preview.cloudfront true
          aws cloudfront create-invalidation --distribution-id ${{ env.CDN_DISTRIBUTION_ID }} --paths "/*"

  notify:
    if: failure() || success()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Send notification to Microsoft Teams
        uses: thechetantalwar/teams-notify@v2
        with:
          teams_webhook_url: ${{ secrets.TEAM_HOOK }}
          message: 'GitHub Action Build Number: ${{ github.run_number }}, Build & Deploy status: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Pushed by: ${{ github.actor }} at ${{ github.event.head_commit.timestamp }}. Deployment: ${{ needs.deploy.result }}.'
